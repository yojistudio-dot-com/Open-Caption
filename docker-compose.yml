version: '3.8'

services:
  whisper-subtitle-studio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whisper_subtitle_studio
    ports:
      - "8501:8501"
    volumes:
      # Persistent cache for downloaded Whisper AI models
      - whisper-cache:/root/.cache/whisper
    restart: unless-stopped
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
    # Optional GPU support (Uncomment if using NVIDIA Container Toolkit)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  whisper-cache:
    driver: local
